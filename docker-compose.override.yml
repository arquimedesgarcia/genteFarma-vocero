# ============================================================
# Override de compose — rama agent-qa
# - Fixes DATABASE_URL (el original hardcodea *** como bug)
# - Añade BOT_API_KEY, WA_MOCK_ENABLED, META_GRAPH_BASE_URL, MEDIA_DIR
# - Añade NEA agent + su Postgres dedicado
# - Monta volumen de media
# ============================================================
services:
  app:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_API_KEY: ${BOT_API_KEY:-}
      WA_MOCK_ENABLED: ${WA_MOCK_ENABLED:-false}
      META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-}
      MEDIA_DIR: ${MEDIA_DIR:-./.dev-media}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-ollama-local}
      OPENROUTER_BASE_URL: http://host.docker.internal:11500
      OPENROUTER_JUDGE_MODEL: meituan/longcat-2.0
      NEA_AGENT_URL: http://nea:8000
      NODE_ENV: development
    volumes:
      - ${MEDIA_DIR:-./.dev-media}:/data/media
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  nea-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nea
    volumes:
      - nea_data:/var/lib/postgresql/data

  nea:
    build:
      context: ../agentNEA
      dockerfile: Dockerfile
    depends_on:
      - nea-db
      - app
    environment:
      - CRM_BASE_URL=http://app:3000
      - CRM_BOT_API_KEY=${BOT_API_KEY}
      - OPENAI_API_KEY=ollama
      - OPENAI_MODEL=qwen2.5-coder:14b
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@nea-db:5432/nea
      - AGENT_NAME=Nea
      - AGENT_TIMEZONE=America/Caracas

volumes:
  nea_data:
