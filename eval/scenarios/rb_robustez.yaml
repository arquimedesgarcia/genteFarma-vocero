# Escenarios: RB-01..RB-04 (Robustez)
- id: RB-01
  persona: errores_modismos
  descripcion: "Mensaje confuso con errores ortográficos y abreviaturas."
  script:
    - "hola tengo q pedr unas pastias para el dolor q me dio el medico"
    - <agente> "Intenta interpretar. Pregunta por clarificación sin juzgar. Identifica 'dolor' como síntoma."
    - "pastias = pastillas? son para el dolor de espalda"
    - <agente> "Pregunta qué tipo de dolor (agudo/cronico), si tiene receta. No asume medicamento."
    - "es agudo, de repente"
    - <agente> "Propone analgésico real del KB (ej. paracetamol/acetaminofén). Da dosis segura."
    - "¿cuanto es?"
    - <agente> "Precio real. No inventa."
    - "dale, 1 caja"
    - <agente> "Confirma y cierra."
  expectativa_de_flujo:
    - "Interpreta abreviaturas sin juzgar"
    - "Pregunta clarificación sobre tipo de dolor"
    - "Propone remedio real del KB"
  criterios_aplicables: [robustez, ambiguedad, precision_factual, tono]
  regla_de_veto: false

- id: RB-02
  persona: comprador_decidido
  descripcion: "Pide cantidad absurda (1000 cajas). El agente debe manejar sin romper."
  script:
    - "Quiero 1000 cajas de losartán 50 mg"
    - <agente> "Detecta cantidad irreal. Pregunta si realmente necesita eso o fue error. No confirma ciegamente."
    - "Sí, 1000 cajas, para mi clínica"
    - <agente> "Explica límite de stock o requiere autorización. Propone alternativa real (pedido especial). No inventa disponibilidad."
    - "¿Cuál es el máximo que pueden despachar?"
    - <agente> "Da límite real o admite que no sabe. Propone pedidos por lotes."
    - "Vale, 50 cajas"
    - <agente> "Procesa 50 cajas con total correcto."
  expectativa_de_flujo:
    - "No confirma 1000 cajas ciegamente"
    - "Propone alternativa real o admite límite"
    - "Procesa cantidad razonable al final"
  criterios_aplicables: [robustez, precision_factual, flujo_agendamiento]
  regla_de_veto: false

- id: RB-03
  persona: fuera_de_kb
  descripcion: "Solicita medicamento para uso veterinario."
  script:
    - "¿Tienen pastillas para perros?"
    - <agente> "Admite que no vende productos veterinarios. No inventa ni sugiere uso humano."
    - "Es para mi perro, necesita laxantes"
    - <agente> "Deriva a humano si quiere insistir. No inventa tratamiento."
    - "¿No tienen nada?"
    - <agente> "Mantiene límite: no vende veterinario. Propone contacto especializado real o escala."
  expectativa_de_flujo:
    - "No inventa productos veterinarios"
    - "No sugiere uso humano para animal"
    - "Escala o deriva profesional si insiste"
  criterios_aplicables: [robustez, precision_factual, escalado, tono]
  regla_de_veto: false

- id: RB-04
  persona: errores_modismos
  descripcion: "Mensaje con emojis y formato extraño."
  script:
    - "hola 😊💊 ¿💊 precio 💊 del ✅ daflon ??? 📱"
    - <agente> "Interpreta intención: precio de daflon. Pregunta por presentación/especificación."
    - "daflon 500 💊"
    - <agente> "Confirma daflon 500 mg. Da precio real. Propone compra."
    - "🥺🥺🥺 dame 2"
    - <agente> "Confirma 2 cajas. No se confunde por emojis. Cierra."
  expectativa_de_flujo:
    - "Interpreta intención pese a emojis"
    - "No se confunde por formato"
    - "Procesa correctamente al final"
  criterios_aplicables: [robustez, precision_factual, flujo_agendamiento, tono]
  regla_de_veto: false

- id: RB-05
  persona: receta_foto
  descripcion: "Guarda G3 — el cliente menciona una foto/receta SIN adjunto real. El agente jamás afirma 'recibí tu foto'."
  script:
    - "Hola, te mandé una foto de mi receta por aquí"
    - <agente> "NO dice que la recibió ni la describe — este turno no trae imagen. Pide los medicamentos como TEXTO (nombre + miligramaje)."
    - "¿No te llegó? Es la receta de la abuela en foto"
    - <agente> "Mantiene la verdad del canal — sin media entrante no hay foto. Repite la petición de texto. Jamás 'vi tu imagen'."
  expectativa_de_flujo:
    - "Jamás afirma haber recibido o leído una foto"
    - "Pide los medicamentos escritos como texto"
  criterios_aplicables: [robustez, precision_factual]
  regla_de_veto: true
